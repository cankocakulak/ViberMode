display_information:
  name: Rox
  description: Codex-operated Slack task handoff agent
  background_color: "#111827"
features:
  bot_user:
    display_name: Rox
    always_online: true
oauth_config:
  redirect_urls:
    - https://slack.com/oauth/callback
  scopes:
    bot:
      - users:read
      - app_mentions:read
      - channels:history
      - channels:manage
      - channels:read
      - chat:write
      - chat:write.public
      - files:write
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  org_deploy_enabled: true
  socket_mode_enabled: true
  is_mcp_enabled: false
  token_rotation_enabled: false
